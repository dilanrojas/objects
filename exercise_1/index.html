<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Objects In JavaScript</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="main.js"></script>
</head>

<body class="bg-slate-50 text-slate-800 font-sans antialiased">
  <div class="max-w-5xl px-6 py-12 mx-auto min-h-screen flex flex-col items-center relative">

    <header class="mb-12 text-center">
      <nav class="mb-8 self-start absolute left-0 px-5">
        <a href="../index.html"
          class="group inline-flex items-center gap-2 text-slate-500 hover:text-blue-600 transition-colors duration-200">
          <div
            class="flex items-center justify-center w-8 h-8 rounded-full bg-slate-100 group-hover:bg-blue-100 transition-colors duration-200">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" viewBox="0 0 24 24"
              stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
            </svg>
          </div>
          <span class="font-bold text-sm uppercase tracking-wide">Go Back</span>
        </a>
      </nav>
      <h1 class="text-4xl md:mt-0 mt-12 font-extrabold tracking-tight text-slate-900 mb-3">
        Score<span class="text-blue-600">keeper</span>
      </h1>
      <p class="text-lg text-slate-500 italic">Keepin' track of ur friends score</p>
    </header>

    <main class="w-full">
      <section>
        <div class="flex items-center justify-between mb-8 border-b border-slate-200 pb-4">
          <h2 class="text-xl font-bold uppercase tracking-wider text-slate-400">Friends List</h2>
        </div>

        <ul class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

          <li>
            <article
              class="group bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300">
              <div class="flex flex-col gap-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors">Dilan</h3>
                </div>

                <div class="bg-slate-50 rounded-lg py-4 text-center border border-slate-50">
                  <span class="block text-xs uppercase font-semibold text-slate-400 mb-1">Current Score</span>
                  <span id="dilan-score" class="text-4xl font-black text-slate-800">0</span>
                </div>

                <footer class="flex gap-2">
                  <button
                    class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white font-bold py-3 rounded-xl cursor-pointer shadow-sm"
                    onclick="increaseScore('dilan')">+</button>
                  <button
                    class="flex-1 bg-slate-200 hover:bg-slate-300 active:scale-95 transition-all text-slate-700 font-bold py-3 rounded-xl cursor-pointer"
                    onclick="decreaseScore('dilan')">−</button>
                </footer>
              </div>
            </article>
          </li>

          <li>
            <article
              class="group bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300">
              <div class="flex flex-col gap-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors">Jeremy</h3>
                </div>

                <div class="bg-slate-50 rounded-lg py-4 text-center border border-slate-50">
                  <span class="block text-xs uppercase font-semibold text-slate-400 mb-1">Current Score</span>
                  <span id="jeremy-score" class="text-4xl font-black text-slate-800">0</span>
                </div>

                <footer class="flex gap-2">
                  <button
                    class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white font-bold py-3 rounded-xl cursor-pointer shadow-sm"
                    onclick="increaseScore('jeremy')">+</button>
                  <button
                    class="flex-1 bg-slate-200 hover:bg-slate-300 active:scale-95 transition-all text-slate-700 font-bold py-3 rounded-xl cursor-pointer"
                    onclick="decreaseScore('jeremy')">−</button>
                </footer>
              </div>
            </article>
          </li>

          <li>
            <article
              class="group bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300">
              <div class="flex flex-col gap-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors">Manfred</h3>
                </div>

                <div class="bg-slate-50 rounded-lg py-4 text-center border border-slate-50">
                  <span class="block text-xs uppercase font-semibold text-slate-400 mb-1">Current Score</span>
                  <span id="manfred-score" class="text-4xl font-black text-slate-800">0</span>
                </div>

                <footer class="flex gap-2">
                  <button
                    class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white font-bold py-3 rounded-xl cursor-pointer shadow-sm"
                    onclick="increaseScore('manfred')">+</button>
                  <button
                    class="flex-1 bg-slate-200 hover:bg-slate-300 active:scale-95 transition-all text-slate-700 font-bold py-3 rounded-xl cursor-pointer"
                    onclick="decreaseScore('manfred')">−</button>
                </footer>
              </div>
            </article>
          </li>

          <li>
            <article
              class="group bg-white rounded-2xl p-6 shadow-sm border border-slate-100 hover:shadow-md transition-all duration-300">
              <div class="flex flex-col gap-4">
                <div>
                  <h3 class="text-xl font-bold text-slate-700 group-hover:text-blue-600 transition-colors">Sonia</h3>
                </div>

                <div class="bg-slate-50 rounded-lg py-4 text-center border border-slate-50">
                  <span class="block text-xs uppercase font-semibold text-slate-400 mb-1">Current Score</span>
                  <span id="sonia-score" class="text-4xl font-black text-slate-800">0</span>
                </div>

                <footer class="flex gap-2">
                  <button
                    class="flex-1 bg-blue-600 hover:bg-blue-700 active:scale-95 transition-all text-white font-bold py-3 rounded-xl cursor-pointer shadow-sm"
                    onclick="increaseScore('sonia')">+</button>
                  <button
                    class="flex-1 bg-slate-200 hover:bg-slate-300 active:scale-95 transition-all text-slate-700 font-bold py-3 rounded-xl cursor-pointer"
                    onclick="decreaseScore('sonia')">−</button>
                </footer>
              </div>
            </article>
          </li>

        </ul>
      </section>
    </main>
    <footer class="mt-12 pt-8 border-t border-slate-200 w-full max-w-2xl flex justify-center">
      <a href="./main.js" target="_blank"
        class="group flex items-center gap-2 px-4 py-2 rounded-full bg-slate-100 text-slate-600 hover:bg-blue-600 hover:text-white transition-all duration-300 shadow-sm">

        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
          stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
        </svg>

        <span class="text-xs font-bold uppercase tracking-wider">View Source Code</span>

        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 opacity-50 group-hover:opacity-100" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
      </a>
    </footer>
  </div>
</body>

</html>
